<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <main>
        <div id="PlayerSide">
            <div id="PlayerHeading" class="UserHeading">
                <h1>Human</h1>
            </div>
            <div id="PlayerOptions">
                <button class="rock"></button>
                <button class="paper"></button>
                <button class="scissors"></button>
            </div>
        </div>

        <div id="VS">
            <div id="scores" class="UserHeading">
                <h1 id="HumanScore">0</h1>
                <h1 id="ComputerScore">0</h1>
            </div>
            <div id="VS-Text">
                <h1>VS</h1>
            </div> 
        </div>
    
        <div id="ComputerSide">
            <div id="ComputerHeading" class="UserHeading">
                <h1>Computer</h1>
            </div>
            <div id="ComputerOption">
                <button></button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
